<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DRAKE SHOP 🛍️</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="shop-header">
  <h1>🛍️ DRAKE SHOP</h1>
  <p class="tagline">NFTs • Accounts • Premium • Stars • Gram</p>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-cat="nft">💎 NFTs</button>
  <button class="tab" data-cat="account">👤 Accounts</button>
  <button class="tab" data-cat="premium">👑 Premium</button>
  <button class="tab" data-cat="stars">⭐ Stars</button>
  <button class="tab" data-cat="gram">🪙 Gram</button>
</nav>

<main>
  <div class="grid" id="grid">
    <p class="loading">Loading products…</p>
  </div>
</main>

<footer class="shop-footer">
  <p>Orders are confirmed via bot — owner delivers manually.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
