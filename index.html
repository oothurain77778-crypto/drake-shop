<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DRAKE SHOP 🛍️</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-badge">⚡ OFFICIAL STORE</div>
    <h1>🛍️ DRAKE SHOP</h1>
    <p class="tagline">NFTs • Accounts • Premium • Stars • Gram</p>
    <p class="hero-sub">စိတ်ချရတဲ့ဆိုင် — Order တင်လိုက်, Bot ကနေ အတည်ပြုပေးမယ် ✅</p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-cat="nft">💎<span>NFTs</span></button>
  <button class="tab" data-cat="account">👤<span>Accounts</span></button>
  <button class="tab" data-cat="premium">👑<span>Premium</span></button>
  <button class="tab" data-cat="stars">⭐<span>Stars</span></button>
  <button class="tab" data-cat="gram">🪙<span>Gram</span></button>
</nav>

<main>
  <div class="grid" id="grid">
    <p class="loading">Loading products…</p>
  </div>
</main>

<footer class="shop-footer">
  <p>🔒 Orders are confirmed via @Drakereply_bot — owner delivers manually.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
